<!DOCTYPE html>
<html lang="ja">
<head>
    <title>青藍探偵事務所 - 新規登録</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo_group">
                <img src="img/log.png" alt="ロゴ" >
                <span class="site_title">青藍探偵事務所</span>
            </div>
            <nav>
                <ul>
                    <li><a href="00index.html">HOME</a></li>
                    <li><a href="01work.html">事務内容</a></li>
                    <li><a href="02info.html">事務所情報</a></li>
                    <li><a href="03log_in.html">依頼履歴</a></li>
                </ul>
            </nav>
        </header>
        <div class="login_title_box">初めまして、ようこそ青藍探偵事務所へ</div>

        <div class="login_form_box">
            <form action=XXXX>
                <div class="form_group">
                    <div>
                        メールアドレス: 
                        <input type="text" required id="email">
                    </div>
                    <div>
                        ユーザーID: 
                        <input type="text" required id="name">
                    </div>
                    <div>
                        名前(匿名OK): 
                        <input type="text" required id="name">
                    </div>
                    <div>    
                        パスワード:
                        <input type="password" required id="password">
                    </div>
                    <div>    
                        パスワード確認:
                        <input type="password" required id="password">
                    </div>
                    <div>    
                        認証問題:
                        <select name="question"> 
                            <option value="question_country">行きたい国は？</option> 
                            <option value="question_color">一番好きな色は？</option> 
                            <option value="question_idol">推しは誰ですか？</option> 
                        </select>
                        <input type="text" required id="question">
                    </div>
                    <div>
                        <a href="個人情報.html">個人情報利用(実装していない)</a>
                        <input type="checkbox" required value="agree">同意する
                    </div>
                    <div>
                        <a href="手数料についって.html">手数料についって(実装していない)</a>
                        <input type="checkbox" required value="agree">同意する
                    </div>
                </div>
                <button type="submit" class="send">送信</button>
            </form>
            <a class="back" href="03log_in.html">戻る</a>    
        </div>
    </div>
